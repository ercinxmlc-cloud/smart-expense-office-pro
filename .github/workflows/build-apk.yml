name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build & Sign Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
          cd ..

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/SmartExpenseOfficePro-release.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          keytool -genkeypair -v -keystore release.keystore -alias smartexpense \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass SmartExpense2026 -keypass SmartExpense2026 \
            -dname "CN=Smart Expense Office Pro, OU=Mobile, O=SmartExpense, L=Dhaka, S=Dhaka, C=BD"

          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-key-alias smartexpense \
            --ks-pass pass:SmartExpense2026 --key-pass pass:SmartExpense2026 \
            --out "$SIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify "$SIGNED_APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-expense-office-pro-release-apk
          path: android/app/build/outputs/apk/release/SmartExpenseOfficePro-release.apk
          if-no-files-found: error
